[package]
name = "bose-cli"
version = "0.1.0"
edition = "2021"
description = "Control supported Bose headphones from your terminal"
license = "MIT"
repository = "https://github.com/g4rcez/bose-cli"
homepage = "https://github.com/g4rcez/bose-cli"
documentation = "https://github.com/g4rcez/bose-cli#readme"
readme = "README.md"
keywords = ["bose", "bluetooth", "headphones", "cli", "macos"]
categories = ["command-line-utilities"]
exclude = ["/AGENTS.md", "/specs/"]

[[bin]]
name = "bose"
path = "src/main.rs"

[dependencies]
anyhow = "1"
btleplug = "0.11"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
toml = "0.8"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
